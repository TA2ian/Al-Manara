name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/lib64
  TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/almanara_test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          if apt-cache show libzbar0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libzbar0t64
          else
            sudo apt-get install -y libzbar0
          fi
          sudo apt-get install -y libzbar-dev
          sudo ldconfig
          ldconfig -p | grep -E 'libzbar\.so' || true

      - name: Start PostgreSQL test database
        run: |
          docker run --detach \
            --name almanara-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=test \
            --env POSTGRES_PASSWORD=test \
            --env POSTGRES_DB=almanara_test \
            postgres:16
          for attempt in $(seq 1 30); do
            if docker exec almanara-postgres pg_isready -U test -d almanara_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs almanara-postgres
          exit 1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify QR runtime dependency
        run: |
          python - <<'PY'
          import ctypes
          import ctypes.util
          path = ctypes.util.find_library("zbar")
          print(f"zbar discovered as: {path!r}")
          if not path:
              raise SystemExit("zbar shared library was not discoverable")
          ctypes.CDLL(path)
          from pyzbar.pyzbar import decode
          print("pyzbar/zbar OK")
          PY

      - name: Verify dependency resolution
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -q

      - name: Stop PostgreSQL test database
        if: always()
        run: docker rm --force almanara-postgres >/dev/null 2>&1 || true
