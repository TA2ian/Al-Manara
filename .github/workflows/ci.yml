name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: almanara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d almanara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency resolution
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/almanara_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
