name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/lib64

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: almanara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d almanara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          if apt-cache show libzbar0t64 >/dev/null 2>&1; then
            sudo apt-get install -y libzbar0t64
          else
            sudo apt-get install -y libzbar0
          fi
          sudo apt-get install -y libzbar-dev
          sudo ldconfig
          ldconfig -p | grep -E 'libzbar\.so' || true

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify QR runtime dependency
        run: |
          python - <<'PY'
          import ctypes
          import ctypes.util
          path = ctypes.util.find_library("zbar")
          print(f"zbar discovered as: {path!r}")
          if not path:
              raise SystemExit("zbar shared library was not discoverable")
          ctypes.CDLL(path)
          from pyzbar.pyzbar import decode
          print("pyzbar/zbar OK")
          PY

      - name: Verify dependency resolution
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/almanara_test
        run: python -m pytest -q
