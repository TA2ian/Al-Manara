name: Implement wallet registry hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply wallet registry changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              s2 = s.replace(old, new, -1 if count is None else count)
              p.write_text(s2)

          # Database: immutable verified wallets, soft-delete, and verification metadata.
          db = Path('database.py').read_text()
          replace('database.py',
              "                updated_at TIMESTAMP DEFAULT NOW()\n            )\n        \"\"\")\n\n        await conn.execute(\"\"\"\n            CREATE TABLE IF NOT EXISTS payment_methods",
              "                updated_at TIMESTAMP DEFAULT NOW(),\n                verification_status TEXT DEFAULT 'pending',\n                verified_at TIMESTAMP,\n                deleted_at TIMESTAMP\n            )\n        \"\"\")\n\n        await conn.execute(\"\"\"\n            CREATE TABLE IF NOT EXISTS payment_methods")
          replace('database.py',
              '        await conn.execute("ALTER TABLE saved_addresses ADD COLUMN IF NOT EXISTS qr_photo_id TEXT")',
              '        await conn.execute("ALTER TABLE saved_addresses ADD COLUMN IF NOT EXISTS qr_photo_id TEXT")\n        await conn.execute("ALTER TABLE saved_addresses ADD COLUMN IF NOT EXISTS verification_status TEXT DEFAULT \'pending\'")\n        await conn.execute("ALTER TABLE saved_addresses ADD COLUMN IF NOT EXISTS verified_at TIMESTAMP")\n        await conn.execute("ALTER TABLE saved_addresses ADD COLUMN IF NOT EXISTS deleted_at TIMESTAMP")')
          marker = '        await conn.execute("CREATE INDEX IF NOT EXISTS idx_saved_addresses_user ON saved_addresses (user_id)")'
          insert = '''        await conn.execute("CREATE UNIQUE INDEX IF NOT EXISTS uq_saved_addresses_active ON saved_addresses (user_id, address, network) WHERE deleted_at IS NULL")\n\n        # Verified wallet records are immutable. Customers can only delete them (when safe) and add a new verified record.\n        await conn.execute("""\n            CREATE OR REPLACE FUNCTION protect_verified_wallet()\n            RETURNS TRIGGER AS $$\n            BEGIN\n                IF TG_OP = 'UPDATE' AND OLD.verification_status = 'verified' THEN\n                    IF NEW.address IS DISTINCT FROM OLD.address OR NEW.network IS DISTINCT FROM OLD.network\n                       OR NEW.qr_photo_id IS DISTINCT FROM OLD.qr_photo_id THEN\n                        RAISE EXCEPTION 'Verified wallet is immutable; delete and add a new wallet instead';\n                    END IF;\n                END IF;\n                IF TG_OP = 'DELETE' THEN\n                    IF EXISTS (SELECT 1 FROM orders WHERE user_id = OLD.user_id AND wallet_address = OLD.address\n                              AND network = OLD.network AND status IN ('pending','waiting_payment','receipt_received','payment_confirmed')) THEN\n                        RAISE EXCEPTION 'Wallet is linked to an active order and cannot be deleted';\n                    END IF;\n                    RETURN OLD;\n                END IF;\n                RETURN NEW;\n            END;\n            $$ LANGUAGE plpgsql;\n        """)\n        await conn.execute("DROP TRIGGER IF EXISTS trg_protect_verified_wallet ON saved_addresses")\n        await conn.execute("""CREATE TRIGGER trg_protect_verified_wallet\n            BEFORE UPDATE OR DELETE ON saved_addresses\n            FOR EACH ROW EXECUTE FUNCTION protect_verified_wallet()""")\n\n        # Legacy saved wallets with a stored QR remain pending until re-verified; never silently trust old QR data.\n'''
          if marker not in db:
              raise SystemExit('database index marker not found')
          db = db.replace(marker, marker + '\n' + insert)
          Path('database.py').write_text(db)

          # FSM state for the dedicated wallet manager.
          replace('states.py',
              'class ReceiptStates(StatesGroup):',
              "class WalletStates(StatesGroup):\n    \"\"\"Customer wallet registry states.\"\"\"\n    waiting_address = State()\n    waiting_qr = State()\n    waiting_label = State()\n\n\nclass ReceiptStates(StatesGroup):")

          # Main menu entry.
          replace('keyboards/inline.py',
              '                InlineKeyboardButton(text="👤 حسابي", callback_data="menu_profile"),\n                InlineKeyboardButton(text="💱 سعر الصرف", callback_data="menu_rate"),',
              '                InlineKeyboardButton(text="👤 حسابي", callback_data="menu_profile"),\n                InlineKeyboardButton(text="👛 محافظي", callback_data="menu_wallets"),\n                InlineKeyboardButton(text="💱 سعر الصرف", callback_data="menu_rate"),')

          # Register wallet manager before legacy wallet/order routers.
          replace('bot.py',
              '        saved_wallets,\n        order,',
              '        saved_wallets,\n        wallets,\n        order,')
          replace('bot.py',
              '    dp.include_router(saved_wallets.router)\n    dp.include_router(order.router)',
              '    dp.include_router(saved_wallets.router)\n    dp.include_router(wallets.router)\n    dp.include_router(order.router)')

          # Legacy order selection must only expose verified, active wallet records.
          replace('handlers/order.py',
              'WHERE user_id = $1 ORDER BY created_at DESC',
              "WHERE user_id = $1 AND verification_status = 'verified' AND deleted_at IS NULL ORDER BY created_at DESC", 1)
          replace('handlers/order.py',
              'SELECT address, network FROM saved_addresses WHERE id = $1 AND user_id = $2',
              "SELECT address, network, label, qr_photo_id FROM saved_addresses WHERE id = $1 AND user_id = $2 AND verification_status = 'verified' AND deleted_at IS NULL")

          # Never allow skipping the wallet QR in the legacy order flow.
          for old in [
              'await _proceed_after_qr(callback, state, lang, data)\n\n\n@router.callback_query(F.data.startswith("switch_to_network_")',
              'await _proceed_after_qr(message, state, lang, data)\n\n\n# ───── QR Mismatch Handlers ─────',
          ]:
              pass
          # Replace skip handlers with hard stops.
          import re
          s = Path('handlers/order.py').read_text()
          s = re.sub(r'@router\.callback_query\(OrderStates\.waiting_wallet_qr, F\.data == "skip_wallet_qr"\).*?@router\.callback_query\(F\.data\.startswith\("switch_to_network_"\)',
              '''@router.callback_query(OrderStates.waiting_wallet_qr, F.data == "skip_wallet_qr")\nasync def skip_wallet_qr(callback: CallbackQuery, state: FSMContext):\n    lang = await _get_user_lang(callback.from_user.id)\n    await callback.answer("QR إلزامي للتحقق من العنوان" if lang == 'ar' else "Wallet QR verification is required", show_alert=True)\n\n\n@router.callback_query(F.data.startswith("switch_to_network_"))''', s, flags=re.S)
          s = re.sub(r'@router\.callback_query\(F\.data == "qr_mismatch_skip"\).*?@router\.callback_query\(F\.data\.startswith\("switch_to_network_"\)',
              '''@router.callback_query(F.data == "qr_mismatch_skip")\nasync def qr_mismatch_skip(callback: CallbackQuery, state: FSMContext):\n    lang = await _get_user_lang(callback.from_user.id)\n    await callback.answer("لا يمكن تخطي مطابقة QR" if lang == 'ar' else "QR match cannot be skipped", show_alert=True)\n\n\n@router.callback_query(F.data.startswith("switch_to_network_"))''', s, flags=re.S)
          # If QR cannot be decoded or processing errors occur, stop instead of continuing unverified.
          s = s.replace('''            # No QR code readable in image — continue with a note\n            await message.answer(\n                "⚠️ لم نتمكن من فك QR code في الصورة. سيتم المتابعة بدون تحقق." if lang == 'ar'\n                else "⚠️ Could not decode QR code in the image. Continuing without verification."\n            )\n            await state.update_data(wallet_qr_photo_id=qr_photo_id)\n            await _proceed_after_qr(message, state, lang, data)\n            return''', '''            await message.answer(\n                "❌ لم نتمكن من قراءة QR. أرسل صورة QR واضحة مرتبطة بنفس العنوان." if lang == 'ar'\n                else "❌ Could not read the QR code. Send a clear QR for the same address."\n            )\n            return''')
          s = s.replace('''        if qr_photo_id:\n            await state.update_data(wallet_qr_photo_id=qr_photo_id)\n        await message.answer(\n            "⚠️ حدث خطأ أثناء معالجة QR code. سيتم المتابعة بدون تحقق." if lang == 'ar'\n            else "⚠️ An error occurred while processing the QR code. Continuing without verification."\n        )\n        await _proceed_after_qr(message, state, lang, data)\n        return''', '''        await message.answer(\n            "❌ تعذر التحقق من QR. أرسل صورة QR أخرى واضحة." if lang == 'ar'\n            else "❌ QR verification failed. Please send another clear QR image."\n        )\n        return''')
          Path('handlers/order.py').write_text(s)

          # Remove the duplicate save_address_yes callback from saved_wallets.py; order.py remains the single owner of this callback.
          sw = Path('handlers/saved_wallets.py').read_text()
          sw = sw.split('@router.callback_query(OrderStates.waiting_save_address, F.data == "save_address_yes")')[0].rstrip() + '\n'
          Path('handlers/saved_wallets.py').write_text(sw)

          # Dedicated wallet registry: add/verify/delete/label, with no edit path.
          Path('handlers/wallets.py').write_text(r'''"""Customer wallet registry: immutable verified addresses with delete-and-add semantics."""
import io
from aiogram import Router, F
from aiogram.fsm.context import FSMContext
from aiogram.types import Message, CallbackQuery, InlineKeyboardButton, InlineKeyboardMarkup
from PIL import Image
from pyzbar.pyzbar import decode as qr_decode

from database import get_pool
from states import WalletStates
from services.wallet_validator import WalletValidator

router = Router()


def _menu(lang):
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="➕ إضافة عنوان جديد" if lang == "ar" else "➕ Add new address", callback_data="wallet_add")],
        [InlineKeyboardButton(text="🔙 رجوع" if lang == "ar" else "🔙 Back", callback_data="wallet_back")],
    ])


async def _user(telegram_id):
    pool = await get_pool()
    async with pool.acquire() as conn:
        return await conn.fetchrow("SELECT id, language FROM users WHERE telegram_id = $1", telegram_id)


async def _render(callback: CallbackQuery, user_id: int, lang: str):
    pool = await get_pool()
    async with pool.acquire() as conn:
        rows = await conn.fetch("""SELECT id, address, network, label, is_default, verification_status
            FROM saved_addresses WHERE user_id = $1 AND deleted_at IS NULL ORDER BY network, is_default DESC, created_at DESC""", user_id)
    if not rows:
        text = "👛 <b>محافظي</b>\n\nلا توجد عناوين موثقة بعد." if lang == "ar" else "👛 <b>My Wallets</b>\n\nNo verified addresses yet."
        await callback.message.edit_text(text, reply_markup=_menu(lang), parse_mode="HTML")
        return
    lines = ["👛 <b>محافظي</b>\n" if lang == "ar" else "👛 <b>My Wallets</b>\n"]
    buttons = []
    for r in rows:
        icon = "🟡" if r["network"] == "BEP20" else "🔷"
        status = "🟢 موثق" if r["verification_status"] == "verified" else "🟡 قيد التحقق"
        label = r["label"] or "بدون اسم"
        star = " ⭐" if r["is_default"] else ""
        lines.append(f"{icon} <b>{label}</b>{star}\n{r['network']} · <code>{r['address']}</code>\n{status}\n")
        buttons.append([InlineKeyboardButton(text=f"🗑 حذف {label}", callback_data=f"wallet_delete_{r['id']}")])
    buttons.extend(_menu(lang).inline_keyboard)
    await callback.message.edit_text("\n".join(lines), reply_markup=InlineKeyboardMarkup(inline_keyboard=buttons), parse_mode="HTML")


@router.callback_query(F.data == "menu_wallets")
async def show_wallets(callback: CallbackQuery, state: FSMContext):
    user = await _user(callback.from_user.id)
    if not user:
        await callback.answer("❌ User not found", show_alert=True); return
    await state.clear()
    await _render(callback, user["id"], user["language"] or "ar")
    await callback.answer()


@router.callback_query(F.data == "wallet_add")
async def wallet_add(callback: CallbackQuery, state: FSMContext):
    user = await _user(callback.from_user.id)
    lang = (user["language"] or "ar") if user else "ar"
    await state.set_state(WalletStates.waiting_address)
    await callback.message.edit_text(
        "➕ <b>إضافة عنوان محفظة</b>\n\nأرسل عنوان BEP20 أو TRC20. لا يمكن تعديل العنوان بعد التوثيق؛ التغيير يتم بالحذف ثم إضافة عنوان جديد.\n\n🔒 يجب إرسال QR مطابق قبل الحفظ." if lang == "ar" else
        "➕ <b>Add wallet address</b>\n\nSend a BEP20 or TRC20 address. Verified addresses cannot be edited; changes require delete + add.\n\n🔒 A matching QR is required before saving.",
        parse_mode="HTML")
    await callback.answer()


@router.message(WalletStates.waiting_address)
async def wallet_address(message: Message, state: FSMContext):
    user = await _user(message.from_user.id); lang = (user["language"] or "ar") if user else "ar"
    address = (message.text or "").replace(" ", "").strip()
    network = WalletValidator.detect_network(address)
    if not network or not WalletValidator.validate(address, network)["valid"]:
        await message.answer("❌ العنوان غير صالح لـ BEP20/TRC20." if lang == "ar" else "❌ Invalid BEP20/TRC20 address.")
        return
    await state.update_data(wallet_address=address, network=network)
    await state.set_state(WalletStates.waiting_qr)
    await message.answer("📸 أرسل QR لهذا العنوان الآن. لا يمكن تخطي التحقق." if lang == "ar" else "📸 Send the QR for this address now. Verification cannot be skipped.")


@router.message(WalletStates.waiting_qr, F.photo)
async def wallet_qr(message: Message, state: FSMContext):
    user = await _user(message.from_user.id); lang = (user["language"] or "ar") if user else "ar"
    data = await state.get_data(); address = data["wallet_address"]; network = data["network"]
    raw = io.BytesIO(); await message.bot.download(file=message.photo[-1].file_id, destination=raw); raw.seek(0)
    try:
        decoded = qr_decode(Image.open(raw))
        qr_text = decoded[0].data.decode("utf-8").strip() if decoded else ""
    except Exception:
        qr_text = ""
    if not qr_text:
        await message.answer("❌ لم أتمكن من قراءة QR. أرسل صورة أوضح." if lang == "ar" else "❌ QR could not be read. Send a clearer image."); return
    normalized = qr_text.strip()
    for prefix in ("ethereum:", "tron:", "trc20:", "bep20:", "usdt:"):
        if normalized.lower().startswith(prefix): normalized = normalized[len(prefix):].strip()
    if normalized.lower() != address.lower():
        await message.answer("❌ QR لا يطابق العنوان. أعد إرسال QR مطابق." if lang == "ar" else "❌ QR does not match the address. Send the matching QR again."); return
    await state.update_data(wallet_qr_photo_id=message.photo[-1].file_id)
    await state.set_state(WalletStates.waiting_label)
    await message.answer("🏷️ أرسل اسماً للعنوان، مثل: Binance أو محفظتي الرئيسية." if lang == "ar" else "🏷️ Send a label, e.g. Binance or Main Wallet.")


@router.message(WalletStates.waiting_label)
async def wallet_label(message: Message, state: FSMContext):
    user = await _user(message.from_user.id); lang = (user["language"] or "ar") if user else "ar"
    label = (message.text or "").strip()[:64]
    if not label:
        await message.answer("❌ الاسم مطلوب." if lang == "ar" else "❌ A label is required."); return
    data = await state.get_data(); pool = await get_pool()
    async with pool.acquire() as conn:
        existing = await conn.fetchrow("SELECT id FROM saved_addresses WHERE user_id=$1 AND address=$2 AND network=$3 AND deleted_at IS NULL", user["id"], data["wallet_address"], data["network"])
        if existing:
            await message.answer("❌ هذا العنوان موجود بالفعل. لا يمكن تعديله؛ احذف السجل الحالي أولاً ثم أضفه من جديد." if lang == "ar" else "❌ This address already exists. It cannot be edited; delete it first and add it again."); return
        await conn.execute("INSERT INTO saved_addresses (user_id,address,network,label,qr_photo_id,is_default,verification_status,verified_at) VALUES ($1,$2,$3,$4,$5,FALSE,'verified',NOW())", user["id"], data["wallet_address"], data["network"], label, data["wallet_qr_photo_id"])
    await state.clear()
    await message.answer("✅ تم حفظ العنوان وتوثيقه. العنوان مقفل ولا يمكن تعديله؛ يمكن حذفه وإضافة عنوان جديد فقط." if lang == "ar" else "✅ Address saved and verified. It is locked; only delete + add a new address is allowed.")


@router.callback_query(F.data.startswith("wallet_delete_"))
async def wallet_delete(callback: CallbackQuery):
    user = await _user(callback.from_user.id)
    lang = (user["language"] or "ar") if user else "ar"
    try: wallet_id = int(callback.data.rsplit("_", 1)[1])
    except ValueError: await callback.answer("Invalid wallet", show_alert=True); return
    pool = await get_pool()
    async with pool.acquire() as conn:
        row = await conn.fetchrow("SELECT id,address,network,label FROM saved_addresses WHERE id=$1 AND user_id=$2 AND deleted_at IS NULL", wallet_id, user["id"])
        if not row: await callback.answer("❌ العنوان غير موجود", show_alert=True); return
        active = await conn.fetchval("SELECT 1 FROM orders WHERE user_id=$1 AND wallet_address=$2 AND network=$3 AND status IN ('pending','waiting_payment','receipt_received','payment_confirmed') LIMIT 1", user["id"], row["address"], row["network"])
        if active:
            await callback.answer("❌ لا يمكن حذف عنوان مرتبط بطلب نشط.", show_alert=True); return
        await conn.execute("UPDATE saved_addresses SET deleted_at=NOW() WHERE id=$1 AND user_id=$2", wallet_id, user["id"])
    await callback.answer("تم حذف العنوان" if lang == "ar" else "Address deleted")
    await _render(callback, user["id"], lang)


@router.callback_query(F.data == "wallet_back")
async def wallet_back(callback: CallbackQuery, state: FSMContext):
    await state.clear()
    await callback.answer()
    from keyboards.inline import main_menu_inline
    user = await _user(callback.from_user.id); lang = (user["language"] or "ar") if user else "ar"
    await callback.message.edit_text("🏠 <b>القائمة الرئيسية</b>" if lang == "ar" else "🏠 <b>Main menu</b>", reply_markup=main_menu_inline(lang), parse_mode="HTML")
''')

          # Add tests for immutable wallet policy and mandatory QR UI contract.
          Path('tests/test_wallet_registry_policy.py').write_text('''import ast\nfrom pathlib import Path\n\n\ndef test_wallet_registry_has_no_edit_callback():\n    source = Path("handlers/wallets.py").read_text()\n    assert "wallet_edit_" not in source\n    assert "wallet_delete_" in source\n\n\ndef test_verified_wallet_is_required_for_order_selection():\n    source = Path("handlers/order.py").read_text()\n    assert "verification_status = \'verified\'" in source\n    assert "deleted_at IS NULL" in source\n\n\ndef test_wallet_registry_is_syntax_valid():\n    ast.parse(Path("handlers/wallets.py").read_text())\n''')

          # Syntax check before committing.
          import ast
          for name in ['database.py','states.py','bot.py','keyboards/inline.py','handlers/order.py','handlers/saved_wallets.py','handlers/wallets.py']:
              ast.parse(Path(name).read_text())
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database.py states.py bot.py keyboards/inline.py handlers/order.py handlers/saved_wallets.py handlers/wallets.py tests/test_wallet_registry_policy.py
          git diff --cached --quiet || git commit -m 'feat: lock verified wallets and add wallet manager'
          git push

      - name: Run focused tests
        run: python -m unittest discover -s tests -p 'test_wallet_registry_policy.py' -v
